<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PhishGuard AI-based phishing website detection">
  <title>{% block title %}PhishGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3 4 6v6c0 4.5 3.2 8 8 9 4.8-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>PhishGuard</a>
    <span class="tagline">AI-based phishing detection</span>
  </div>
</header>

<main class="container main-content">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">PhishGuard · reads the address text only and never visits the site</div>
</footer>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
