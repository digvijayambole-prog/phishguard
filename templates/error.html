{% extends "base.html" %}
{% block title %}Analysis Error — PhishGuard{% endblock %}
{% block content %}
<section class="card error-panel">
  <p class="eyebrow">ANALYSIS STATUS</p>
  <div class="error-icon" aria-hidden="true">!</div>
  <h1>{{ error.message }}</h1>
  {% if error.code %}
  <p class="error-code">{{ error.code }}</p>
  {% endif %}
  <p>Check the submitted address and try again.</p>
  <a class="button" href="/">Back to analyzer</a>
</section>
{% endblock %}
