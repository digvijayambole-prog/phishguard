<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PhishGuard AI-based phishing website detection">
  <title>{% block title %}PhishGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">🛡️ PhishGuard</a>
    <span class="tagline">AI-based phishing detection</span>
  </div>
</header>

<main class="container main-content">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">PhishGuard • Frontend & QA</div>
</footer>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
